<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" font-family="'Segoe UI',system-ui,-apple-system,Roboto,sans-serif">
  <defs>
    <marker id="big" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      text{fill:#0e1116}
      .title{font-size:30px;font-weight:800}
      .tag{font-size:14px;font-weight:700;fill:#64748b}
      .ph{font-size:19px;font-weight:800}
      .sub{font-size:13.5px;fill:#64748b;font-weight:600}
      .chip{font-size:14.5px;font-weight:600;fill:#1e293b}
      .b{font-size:13.5px;fill:#334155;font-weight:500}
      .cap{font-size:13px;fill:#64748b;font-weight:600;font-style:italic}
      .ck{font-size:15px;font-weight:800;fill:#3fb950}
    </style>
  </defs>

  <rect x="0" y="0" width="1120" height="680" rx="18" fill="#f8fafc"/>
  <rect x="1" y="1" width="1118" height="678" rx="18" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <text class="title" x="40" y="52">Phar Lap plugs into the web you already use</text>
  <text class="tag" x="1080" y="50" text-anchor="end">🐎  PHAR LAP</text>

  <!-- flow arrows -->
  <path d="M314,360 L356,360" fill="none" stroke="#64748b" stroke-width="6" marker-end="url(#big)"/>
  <path d="M764,360 L806,360" fill="none" stroke="#64748b" stroke-width="6" marker-end="url(#big)"/>

  <!-- PANEL A — SHARE -->
  <rect x="40" y="120" width="274" height="470" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="40" y="120" width="274" height="8" rx="4" fill="#3fb950"/>
  <text class="ph" x="60" y="162">① Share it like normal</text>
  <text class="sub" x="60" y="184">Any channel you already use</text>

  <g class="chip">
    <rect x="58" y="200" width="238" height="46" rx="10" fill="#f1f5f9"/><text x="74" y="228">📧  Your email list</text>
    <rect x="58" y="256" width="238" height="46" rx="10" fill="#f1f5f9"/><text x="74" y="284">📱  A social post</text>
    <rect x="58" y="312" width="238" height="46" rx="10" fill="#f1f5f9"/><text x="74" y="340">✍️  Blog / newsletter</text>
    <rect x="58" y="368" width="238" height="46" rx="10" fill="#f1f5f9"/><text x="74" y="396">▶️  A YouTube link</text>
    <rect x="58" y="424" width="238" height="46" rx="10" fill="#f1f5f9"/><text x="74" y="452">💬  Forum / DM / group</text>
  </g>
  <text class="cap" x="177" y="512" text-anchor="middle">It’s just a link — paste it</text>
  <text class="cap" x="177" y="530" text-anchor="middle">anywhere you like.</text>

  <!-- PANEL B — PHAR LAP (hero) -->
  <rect x="360" y="104" width="404" height="502" rx="16" fill="#eff6ff" stroke="#388bfd" stroke-width="2.5"/>
  <rect x="360" y="104" width="404" height="8" rx="4" fill="#388bfd"/>
  <text class="ph" x="384" y="150">② One link. No crypto headaches.</text>
  <text class="sub" x="384" y="172">Feels like any online checkout</text>

  <g>
    <circle cx="396" cy="206" r="13" fill="#e6f4ea"/><text class="ck" x="396" y="211" text-anchor="middle">✓</text>
    <text class="b" x="418" y="202">It’s a normal web link (https://…) —</text>
    <text class="b" x="418" y="221">opens in any browser, phone or desktop.</text>

    <circle cx="396" cy="266" r="13" fill="#e6f4ea"/><text class="ck" x="396" y="271" text-anchor="middle">✓</text>
    <text class="b" x="418" y="262">A wallet is created automatically —</text>
    <text class="b" x="418" y="281">the buyer needs zero crypto know-how.</text>

    <circle cx="396" cy="326" r="13" fill="#e6f4ea"/><text class="ck" x="396" y="331" text-anchor="middle">✓</text>
    <text class="b" x="418" y="322">No password to invent — they simply</text>
    <text class="b" x="418" y="341">save a 12-word seed phrase (their key).</text>

    <circle cx="396" cy="386" r="13" fill="#e6f4ea"/><text class="ck" x="396" y="391" text-anchor="middle">✓</text>
    <text class="b" x="418" y="382">They get their copy in a couple of taps</text>
    <text class="b" x="418" y="401">— and it’s provably theirs.</text>
  </g>

  <rect x="384" y="440" width="356" height="120" rx="12" fill="#ffffff" stroke="#c7dbf5" stroke-width="1.5"/>
  <text x="562" y="470" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">The buyer’s whole “crypto” experience:</text>
  <text x="562" y="498" text-anchor="middle" font-size="13.5" fill="#334155">tap “Buy” → jot down 12 words → done.</text>
  <text x="562" y="524" text-anchor="middle" font-size="13.5" fill="#334155">No exchange, no jargon, no sign-up form.</text>
  <text x="562" y="548" text-anchor="middle" font-size="12.5" font-style="italic" fill="#64748b">(They can add BSV later only if they want more copies.)</text>

  <!-- PANEL C — UPSELL -->
  <rect x="810" y="120" width="270" height="470" rx="14" fill="#fff7f0" stroke="#ff8c42" stroke-width="2.5"/>
  <rect x="810" y="120" width="270" height="8" rx="4" fill="#ff8c42"/>
  <text class="ph" x="830" y="162">③ Add any link</text>
  <text class="sub" x="830" y="184">Point fans anywhere from</text>
  <text class="sub" x="830" y="202">the product page</text>

  <g class="chip">
    <rect x="828" y="222" width="234" height="66" rx="10" fill="#ffffff" stroke="#ffd9bf" stroke-width="1.5"/>
    <text x="844" y="250">🎁  A bonus delivery page</text>
    <text x="844" y="273" font-size="12.5" font-weight="500" fill="#64748b">deliver an extra freebie</text>

    <rect x="828" y="300" width="234" height="82" rx="10" fill="#ffffff" stroke="#ffd9bf" stroke-width="1.5"/>
    <text x="844" y="328">🔗  An affiliate offer</text>
    <text x="844" y="351" font-size="12.5" font-weight="500" fill="#64748b">Clickbank · JVZoo ·</text>
    <text x="844" y="369" font-size="12.5" font-weight="500" fill="#64748b">Shopify · anything</text>

    <rect x="828" y="394" width="234" height="66" rx="10" fill="#ffffff" stroke="#ffd9bf" stroke-width="1.5"/>
    <text x="844" y="422">🐎  Another Phar Lap product</text>
    <text x="844" y="445" font-size="12.5" font-weight="500" fill="#64748b">chain your catalogue</text>
  </g>
  <text class="cap" x="945" y="502" text-anchor="middle">Stack offers just like</text>
  <text class="cap" x="945" y="520" text-anchor="middle">a sales funnel.</text>

  <text x="560" y="648" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Share like web2 · sell with no friction · upsell to anywhere — Phar Lap sits in the middle.</text>
</svg>
