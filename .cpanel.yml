---
# cPanel Git™ Version Control deployment for PHAR LAP.
#
# In cPanel → Git Version Control, clone this repo (branch: main) and click "Deploy HEAD Commit".
# cPanel runs the tasks below to copy the built site into your web root.
#
# DEPLOYPATH is the document root for the deploy domain. Using $HOME (set to the cPanel
# user's home at deploy time) avoids hardcoding the username — so it never lands in this repo.
# Current target: the smartnfts.com addon domain, whose cPanel Document Root shows as
# "/smartnfts.com" (i.e. relative to home → $HOME/smartnfts.com). PHAR LAP runs at the domain
# ROOT with all-relative asset paths, so copying index.html + bundle.js + brand/ there is enough —
# plus the link-preview layer (share.php + register.php + .htaccess) and its writable /og cache dir.
#
# Note: bundle.js is committed on this (main) branch specifically for this copy step — it is the
# esbuild output of src/, refreshed on every publish.
deployment:
  tasks:
    - export DEPLOYPATH="$HOME/smartnfts.com/"
    - /bin/cp index.html "$DEPLOYPATH"
    - /bin/cp bundle.js "$DEPLOYPATH"
    - /bin/cp -R brand "$DEPLOYPATH"
    - /bin/cp share.php "$DEPLOYPATH"
    - /bin/cp register.php "$DEPLOYPATH"
    - /bin/cp .htaccess "$DEPLOYPATH"
    - /bin/mkdir -p "$DEPLOYPATH/og"
